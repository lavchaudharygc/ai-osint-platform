<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-OSINT | Investigation Platform</title>
    <style>
        body {
            background: #0a0a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1a1a3a;
            padding: 40px;
            border-radius: 10px;
            width: 500px;
        }
        h1 { color: #e94560; text-align: center; }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #333;
            background: #0a0a2a;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background: #e94560;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #ff6b81; }
        #results {
            margin-top: 20px;
            padding: 20px;
            background: #0a0a2a;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 AI-OSINT Platform</h1>
        <p style="text-align:center; color:#999;">Law Enforcement Investigation Tool v0.1</p>
        
        <label>Username:</label>
        <input type="text" id="username" placeholder="Enter username to investigate...">
        
        <label>Platform:</label>
        <select id="platform">
            <option value="instagram">Instagram</option>
            <option value="twitter">Twitter</option>
            <option value="telegram">Telegram</option>
        </select>
        
        <button onclick="startInvestigation()">Start Investigation</button>
        
        <div id="results">
            <h3>Results:</h3>
            <pre id="result-content"></pre>
        </div>
    </div>
    
    <script>
        async function startInvestigation() {
            const username = document.getElementById('username').value;
            const platform = document.getElementById('platform').value;
            
            if (!username) {
                alert('Please enter a username');
                return;
            }
            
            document.getElementById('results').style.display = 'block';
            document.getElementById('result-content').textContent = '🔎 Investigating...';
            
            try {
                const response = await fetch(
                    `http://localhost:8000/investigate?username=${username}&platform=${platform}`,
                    { method: 'POST' }
                );
                const data = await response.json();
                document.getElementById('result-content').textContent = 
                    JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('result-content').textContent = 
                    '❌ Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
